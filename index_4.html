<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Recipe Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:        #c8985f;   /* light brown gui panel */
    --panel-light:  #e2b986;   /* bevel highlight */
    --panel-dark:   #8a6136;   /* bevel shadow */
    --slot:         #a67848;   /* recessed slot bg */
    --slot-dark:    #6e4a26;   /* recessed slot shadow */
    --slot-light:   #d9ac74;   /* recessed slot highlight */
    --ink:          #402b12;   /* dark brown text */
    --ink-soft:      #5c3f1e;
    --page-bg-1:    #dcb37e;
    --page-bg-2:    #c99a63;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    height:100%;
    overflow: hidden;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 4px),
      linear-gradient(160deg, var(--page-bg-1), var(--page-bg-2));
    color: var(--ink);
    font-family: 'VT323', monospace;
    font-size: clamp(14px, 1.6vh, 20px);
  }

  .wrap{
    width: 100%;
    height: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: clamp(10px, 2vh, 28px) clamp(10px, 2vw, 16px);
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    gap: clamp(8px, 1.6vh, 22px);
  }

  h1{
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(11px, 2.2vh, 15px);
    line-height: 1.6;
    text-align:center;
    color: var(--ink);
    text-shadow: 1px 1px 0 var(--panel-light);
    margin: 0;
    letter-spacing: 1px;
    flex: 0 0 auto;
  }
  h1 span{ display:block; font-size:0.6em; color:var(--ink-soft); margin-top:10px; font-family:'Press Start 2P',monospace; }

  /* ---------- generic beveled Minecraft panel ---------- */
  .panel{
    background: var(--panel);
    border: 4px solid transparent;
    border-image: none;
    box-shadow:
      inset 2px 2px 0 var(--panel-light),
      inset -2px -2px 0 var(--panel-dark),
      inset 4px 4px 0 rgba(0,0,0,0.08),
      0 4px 0 rgba(0,0,0,0.25);
    padding: clamp(10px, 2vh, 18px);
    image-rendering: pixelated;
    flex: 0 0 auto;
  }
  .craft-panel{ flex: 1 1 auto; }

  /* ---------- search ---------- */
  .search-row{
    display:flex;
    gap:10px;
    position:relative;
  }
  #searchInput{
    flex:1;
    font-family:'VT323', monospace;
    font-size: clamp(15px, 2vh, 22px);
    padding: clamp(6px, 1.2vh, 10px) 12px;
    background: var(--slot);
    color: var(--ink);
    border: none;
    box-shadow:
      inset 2px 2px 0 var(--slot-dark),
      inset -2px -2px 0 var(--slot-light);
    outline:none;
  }
  #searchInput::placeholder{ color: var(--ink-soft); opacity:.8; }

  #searchBtn{
    font-family:'Press Start 2P', monospace;
    font-size: 11px;
    padding: 0 16px;
    background: var(--panel);
    color: var(--ink);
    border:none;
    cursor:pointer;
    box-shadow:
      inset 2px 2px 0 var(--panel-light),
      inset -2px -2px 0 var(--panel-dark);
  }
  #searchBtn:active{
    box-shadow:
      inset -2px -2px 0 var(--panel-light),
      inset 2px 2px 0 var(--panel-dark);
  }

  .suggestions{
    position:absolute;
    top: 100%;
    left:0; right:0;
    background: var(--panel);
    box-shadow:
      inset 2px 2px 0 var(--panel-light),
      inset -2px -2px 0 var(--panel-dark),
      0 6px 10px rgba(0,0,0,0.35);
    z-index: 20;
    max-height: 260px;
    overflow-y:auto;
    display:none;
  }
  .suggestions.show{ display:block; }
  .suggestions div{
    padding: 8px 12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:19px;
  }
  .suggestions div:hover, .suggestions div.active{ background: var(--slot-light); }
  .suggestions img{ width:22px; height:22px; image-rendering:pixelated; }

  .hint{
    font-size:16px;
    color: var(--ink-soft);
    margin-top:8px;
    text-align:center;
  }

  /* ---------- crafting panel ---------- */
  .craft-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: clamp(6px, 1.4vh, 14px);
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }

  .craft-title{
    font-family:'Press Start 2P', monospace;
    font-size: clamp(10px, 1.8vh, 13px);
    text-align:center;
    min-height: 18px;
  }
  .craft-sub{
    font-size: clamp(13px, 1.8vh, 17px);
    color: var(--ink-soft);
    margin-top:-6px;
    text-align:center;
  }

  .craft-area{
    display:flex;
    align-items:center;
    gap: clamp(10px, 3vw, 28px);
    flex-wrap:wrap;
    justify-content:center;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
  }

  :root{
    --slot-size: clamp(50px, min(15vh, 16vw), 200px);
  }

  .grid3{
    display:grid;
    grid-template-columns: repeat(3, var(--slot-size));
    grid-template-rows: repeat(3, var(--slot-size));
    gap: calc(var(--slot-size) * 0.09);
    background: var(--panel);
    padding: calc(var(--slot-size) * 0.14);
    box-shadow:
      inset 2px 2px 0 var(--panel-dark),
      inset -2px -2px 0 var(--panel-light);
  }

  .slot{
    width:var(--slot-size); height:var(--slot-size);
    background: var(--slot);
    box-shadow:
      inset 2px 2px 0 var(--slot-dark),
      inset -2px -2px 0 var(--slot-light);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor: default;
  }
  .slot img{
    width: 66%; height:66%;
    image-rendering: pixelated;
    pointer-events:none;
  }
  .slot .badge{
    position:absolute;
    bottom:2%; right:5%;
    font-family:'Press Start 2P', monospace;
    font-size: calc(var(--slot-size) * 0.16);
    color:#fff;
    text-shadow: 1.5px 1.5px 0 #3a2a12;
    pointer-events:none;
  }

  .arrow{
    font-family:'Press Start 2P', monospace;
    font-size: clamp(20px, 4vh, 42px);
    color: var(--ink);
    text-shadow: 1px 1px 0 var(--panel-light);
  }

  .output-slot{
    width: calc(var(--slot-size) + var(--slot-size) * 0.22); height: calc(var(--slot-size) + var(--slot-size) * 0.22);
    background: var(--slot);
    box-shadow:
      inset 2px 2px 0 var(--slot-dark),
      inset -2px -2px 0 var(--slot-light);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .output-slot img{
    width:66%; height:66%;
    image-rendering:pixelated;
    pointer-events:none;
  }
  .output-slot .badge{
    position:absolute;
    bottom:2%; right:5%;
    font-family:'Press Start 2P', monospace;
    font-size: calc(var(--slot-size) * 0.18);
    color:#fff;
    text-shadow: 1.5px 1.5px 0 #3a2a12;
  }

  .empty-msg{
    font-size:19px;
    color: var(--ink-soft);
    text-align:center;
    padding: 10px 0 2px;
  }

  /* ---------- tooltip (authentic MC item tooltip look) ---------- */
  .mc-tooltip{
    position: fixed;
    background: #100010ee;
    border: 2px solid #28006bcc;
    outline: 2px solid #100010ee;
    color: #fff;
    font-family:'VT323', monospace;
    font-size: 18px;
    padding: 6px 10px;
    pointer-events:none;
    z-index: 100;
    max-width: 220px;
    line-height:1.3;
    display:none;
  }
  .mc-tooltip .alt{
    color:#aaa;
    font-size:14px;
    margin-top:2px;
  }

</style>
</head>
<body>

<div class="wrap">

  <h1>Minecraft Recipe Book<span>every vanilla crafting recipe</span></h1>

  <div class="panel search-panel">
    <div class="search-row">
      <input id="searchInput" type="text" placeholder="Search for an item... (e.g. diamond pickaxe)" autocomplete="off">
      <button id="searchBtn">FIND</button>
      <div id="suggestions" class="suggestions"></div>
    </div>
    <div class="hint">Type a name and press Enter — <span id="recipeCount">loading recipes…</span></div>
  </div>

  <div class="panel craft-panel">
    <div id="craftTitle" class="craft-title">Crafting Table</div>
    <div id="craftSub" class="craft-sub"></div>

    <div class="craft-area">
      <div class="grid3" id="grid3"></div>
      <div class="arrow">&#10148;</div>
      <div class="output-slot" id="outputSlot"></div>
    </div>

    <div id="emptyMsg" class="empty-msg">Search for any craftable item above to see its recipe here.</div>
  </div>
</div>

<div class="mc-tooltip" id="tooltip"></div>

<script>
const TEXTURE_BASE = "https://cdn.jsdelivr.net/gh/misode/mcmeta@assets/assets/minecraft/textures";
const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="32" height="32" fill="#5c3f1e"/><text x="16" y="21" font-size="18" fill="#e2b986" text-anchor="middle" font-family="monospace">?</text></svg>`
);

let RECIPES = [];
let byResultId = {};   // "minecraft:stick" -> recipe
let searchIndex = [];  // [{id, name, item}]

function shortId(fullId){ return fullId.split(":").pop(); }

function displayNameFromId(fullId){
  return shortId(fullId).split("_").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

function setItemImage(imgEl, fullId){
  const name = shortId(fullId);
  const itemUrl = `${TEXTURE_BASE}/item/${name}.png`;
  const blockUrl = `${TEXTURE_BASE}/block/${name}.png`;
  imgEl.src = itemUrl;
  imgEl.onerror = () => {
    imgEl.onerror = () => { imgEl.onerror = null; imgEl.src = PLACEHOLDER; };
    imgEl.src = blockUrl;
  };
}

function makeSlotContent(container, fullId, count){
  container.innerHTML = "";
  if(!fullId) return;
  const img = document.createElement("img");
  setItemImage(img, fullId);
  container.appendChild(img);
  if(count && count > 1){
    const b = document.createElement("span");
    b.className = "badge";
    b.textContent = "x" + count;
    container.appendChild(b);
  }
}

const tooltip = document.getElementById("tooltip");

function attachTooltip(el, mainText, altText){
  el.addEventListener("mousemove", (e) => {
    tooltip.style.display = "block";
    tooltip.style.left = (e.clientX + 14) + "px";
    tooltip.style.top = (e.clientY + 16) + "px";
  });
  el.addEventListener("mouseenter", () => {
    tooltip.innerHTML = mainText + (altText ? `<div class="alt">${altText}</div>` : "");
    tooltip.style.display = "block";
  });
  el.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
}

function renderRecipe(recipe){
  const gridEl = document.getElementById("grid3");
  const outputEl = document.getElementById("outputSlot");
  const emptyMsg = document.getElementById("emptyMsg");
  const craftTitle = document.getElementById("craftTitle");
  const craftSub = document.getElementById("craftSub");

  emptyMsg.style.display = "none";
  gridEl.innerHTML = "";
  outputEl.innerHTML = "";

  craftTitle.textContent = recipe.resultName;
  craftSub.textContent = recipe.type === "shapeless"
    ? "Shapeless — items can go in any slot"
    : "Shaped recipe — arrangement matters";

  for(let i=0;i<9;i++){
    const slot = document.createElement("div");
    slot.className = "slot";
    const cell = recipe.grid[i];
    if(cell && cell.items && cell.items.length){
      const primary = cell.items[0];
      makeSlotContent(slot, primary, null);
      const mainText = cell.label ? cell.label : displayNameFromId(primary);
      let altText = "";
      if(cell.items.length > 1){
        const names = cell.items.map(displayNameFromId);
        altText = names.length > 6
          ? names.slice(0,6).join(", ") + `, +${names.length-6} more`
          : names.join(", ");
      }
      attachTooltip(slot, mainText, altText);
    }
    gridEl.appendChild(slot);
  }

  makeSlotContent(outputEl, recipe.result, recipe.count);
  attachTooltip(outputEl, recipe.resultName, recipe.count > 1 ? `Makes ${recipe.count}` : "");
}

function showEmpty(msg){
  document.getElementById("grid3").innerHTML = "";
  document.getElementById("outputSlot").innerHTML = "";
  document.getElementById("craftTitle").textContent = "Crafting Table";
  document.getElementById("craftSub").textContent = "";
  const emptyMsg = document.getElementById("emptyMsg");
  emptyMsg.style.display = "block";
  emptyMsg.textContent = msg;
  for(let i=0;i<9;i++){
    const slot = document.createElement("div");
    slot.className = "slot";
    document.getElementById("grid3").appendChild(slot);
  }
}

function normalize(s){ return s.toLowerCase().trim(); }

function findRecipe(query){
  const q = normalize(query);
  if(!q) return null;
  // exact match first
  let match = searchIndex.find(e => e.name === q);
  if(match) return byResultId[match.item];
  // starts-with
  match = searchIndex.find(e => e.name.startsWith(q));
  if(match) return byResultId[match.item];
  // contains
  match = searchIndex.find(e => e.name.includes(q));
  if(match) return byResultId[match.item];
  return null;
}

function getSuggestions(query, limit=8){
  const q = normalize(query);
  if(!q) return [];
  const starts = searchIndex.filter(e => e.name.startsWith(q));
  const contains = searchIndex.filter(e => !e.name.startsWith(q) && e.name.includes(q));
  return starts.concat(contains).slice(0, limit);
}

const input = document.getElementById("searchInput");
const suggestionsBox = document.getElementById("suggestions");

function renderSuggestions(list){
  suggestionsBox.innerHTML = "";
  if(list.length === 0){ suggestionsBox.classList.remove("show"); return; }
  list.forEach(entry => {
    const row = document.createElement("div");
    const img = document.createElement("img");
    setItemImage(img, entry.item);
    const label = document.createElement("span");
    label.textContent = entry.displayName;
    row.appendChild(img);
    row.appendChild(label);
    row.addEventListener("click", () => {
      input.value = entry.displayName;
      suggestionsBox.classList.remove("show");
      runSearch(entry.displayName);
    });
    suggestionsBox.appendChild(row);
  });
  suggestionsBox.classList.add("show");
}

function runSearch(query){
  const recipe = findRecipe(query);
  if(recipe){
    renderRecipe(recipe);
  } else {
    showEmpty(`No crafting-table recipe found for "${query}". Try another item name.`);
  }
  suggestionsBox.classList.remove("show");
}

input.addEventListener("input", () => {
  renderSuggestions(getSuggestions(input.value));
});
input.addEventListener("keydown", (e) => {
  if(e.key === "Enter"){ runSearch(input.value); }
  if(e.key === "Escape"){ suggestionsBox.classList.remove("show"); }
});
document.getElementById("searchBtn").addEventListener("click", () => runSearch(input.value));
document.addEventListener("click", (e) => {
  if(!e.target.closest(".search-row")) suggestionsBox.classList.remove("show");
});

fetch("recipes.json")
  .then(r => r.json())
  .then(data => {
    RECIPES = data;
    RECIPES.forEach(r => { byResultId[r.result] = r; });
    searchIndex = RECIPES.map(r => ({
      name: normalize(r.resultName),
      displayName: r.resultName,
      item: r.result
    })).sort((a,b) => a.name.localeCompare(b.name));
    document.getElementById("recipeCount").textContent = `${RECIPES.length} recipes loaded`;
    showEmpty("Search for any craftable item above to see its recipe here.");
  })
  .catch(err => {
    document.getElementById("recipeCount").textContent = "failed to load recipes.json";
    console.error(err);
  });
</script>

</body>
</html>
